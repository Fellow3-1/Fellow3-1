    <!-- Inter is the only face on the page (300 display, 400 text, 500 emphasis).
         Loaded without blocking, with a synchronous fallback for print / no-JS. -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap"
        rel="stylesheet"
      />
    </noscript>
    <script>
      // One gate, set before paint: CSS reveals only apply when JS is alive to fire them.
      document.documentElement.classList.replace("no-js", "js");
    </script>
