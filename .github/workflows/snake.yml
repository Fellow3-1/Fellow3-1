name: Generate snake animation

# The canonical snk recipe from the Platane/snk README, one file only.
#
# Deviations from the README, both deliberate:
#   1. `push` on this file, so the first run happens when the workflow lands
#      instead of waiting up to 12 hours for the cron. Restricting it to this
#      path keeps content merges from re-running the snake.
#   2. `concurrency`, so a manual run and the cron cannot race each other and
#      force-push the output branch twice in parallel.
#
# Emits exactly the filenames the portfolio imports from the `output` branch:
#   github-contribution-grid-snake.svg
#   github-contribution-grid-snake-dark.svg

on:
  schedule: # execute every 12 hours
    - cron: '* */12 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/snake.yml

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
