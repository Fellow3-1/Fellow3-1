<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <radialGradient id="g" cx="50%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#7DFFB3" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#5EFFA6" stop-opacity="0.85"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#7DFFB3" flood-opacity="0.7"/>
    </filter>
  </defs>
  <!-- background -->
  <rect width="128" height="128" rx="28" fill="#000805"/>
  <!-- shield outer -->
  <path d="M64 8 L106 28 L106 66 C106 94 86 116 64 124 C42 116 22 94 22 66 L22 28 Z" fill="none" stroke="url(#g)" stroke-width="3.2" filter="url(#glow)" stroke-linejoin="round"/>
  <!-- inner shield -->
  <path d="M64 16 L96 32 L96 66 C96 88 82 108 64 114 C46 108 32 88 32 66 L32 32 Z" fill="none" stroke="#7DFFB3" stroke-width="1.2" opacity="0.5"/>
  <!-- robot head simplified -->
  <path d="M52 44 L76 44 L80 52 L80 78 L76 86 L52 86 L48 78 L48 52 Z" fill="none" stroke="#B8FFD4" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M56 52 L72 52 L72 60 L56 60 Z" fill="#7DFFB3" opacity="0.9"/>
  <!-- eyes -->
  <rect x="52" y="66" width="10" height="5" rx="2.5" fill="#7DFFB3"/>
  <rect x="66" y="66" width="10" height="5" rx="2.5" fill="#7DFFB3"/>
  <!-- forehead gem -->
  <circle cx="64" cy="52" r="3.5" fill="#E4FFF7" filter="url(#glow)"/>
  <!-- chin -->
  <path d="M56 86 L64 94 L72 86" fill="none" stroke="#7DFFB3" stroke-width="1.4" stroke-linejoin="round"/>
  <!-- side wings tiny -->
  <path d="M32 32 Q24 28 20 36 Q26 40 32 38" fill="#7DFFB3" opacity="0.7"/>
  <path d="M96 32 Q104 28 108 36 Q102 40 96 38" fill="#7DFFB3" opacity="0.7"/>
</svg>
