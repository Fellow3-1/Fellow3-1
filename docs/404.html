  <script>
      // Set the theme before first paint so there is no light/dark flash.
      (function () {
        try {
          var saved = localStorage.getItem("felloh-theme");
          var light = saved ? saved === "light" : window.matchMedia("(prefers-color-scheme: light)").matches;
          document.documentElement.dataset.theme = light ? "light" : "dark";
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute("content", light ? "#f6f8fb" : "#000000");
        } catch (e) {}
      })();
    </script>
  <body>
