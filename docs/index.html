    <script>
      // One gate, set before paint: CSS reveals only apply when JS is alive to fire them.
      document.documentElement.classList.replace("no-js", "js");
      // Theme, set before paint to avoid a flash: stored choice wins,
      // otherwise follow the OS. The nav toggle rewrites this at runtime.
      try {
        var savedTheme = localStorage.getItem("f31-theme");
        if (!savedTheme) {
          savedTheme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.dataset.theme = savedTheme;
        if (savedTheme === "dark") {
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute("content", "#0d060b");
        }
      } catch (error) {
        document.documentElement.dataset.theme = "light";
      }
    </script>

        var body = document.body;
        if (body && !body.classList.contains("is-in")) body.classList.add("is-in");
      }, 2500);
    </script>
