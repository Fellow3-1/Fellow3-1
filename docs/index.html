    <script>
      // One gate, set before paint: CSS reveals only apply when JS is alive to fire them.
      document.documentElement.classList.replace("no-js", "js");
      // Theme, set before paint to avoid a flash: stored choice wins,
      // otherwise follow the OS. The nav toggle rewrites this at runtime.
      try {
        var savedTheme = localStorage.getItem("f31-theme");
        if (!savedTheme) {
          savedTheme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.dataset.theme = savedTheme;
        if (savedTheme === "dark") {
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute("content", "#0d060b");
        }
      } catch (error) {
        document.documentElement.dataset.theme = "light";
      }
    </script>
    <script>
      // Preload exactly one hero strip. The old static <link media="..."> pair
      // keyed off prefers-color-scheme, so a visitor who had pinned the other
      // theme downloaded a crop the <picture> never used. This runs after the
      // theme is known and picks the same file the markup will.
      (function () {
        var dark = document.documentElement.dataset.theme === "dark";
        var phone = window.matchMedia("(max-width: 700px)").matches;
        var file = phone
          ? (dark ? "assets/window-nairobi-mobile.webp" : "assets/hero-skyline-day-mobile.webp")
          : (dark ? "assets/window-nairobi.webp" : "assets/hero-skyline-day.webp");
        var link = document.createElement("link");
        link.rel = "preload";
        link.as = "image";
        link.type = "image/webp";
        link.href = file;
        document.head.appendChild(link);
      })();
    </script>
    <script>

      // lifts it. If that bundle is blocked, fails or is very slow, reveal
      // the content anyway instead of leaving a blank page.
      window.setTimeout(function () {
        var body = document.body;
        if (body && !body.classList.contains("is-in")) body.classList.add("is-in");
      }, 2500);
    </script>
