# Optional: keep the GitHub Contribution Snake auto-updating.
#
# The README currently embeds the generated SVGs committed to the repo root
# (github-snake.svg / github-snake-dark.svg) so the animation always renders,
# even without Actions.
#
# To switch to automatic daily regeneration, copy this file to
# .github/workflows/github-snake.yml (creating workflow files requires the
# `workflows` permission on the token/app used to push, and Actions enabled).
# Then point the snake <img>/<source> URLs in README.md back at the `output`
# branch, e.g.:
#   https://raw.githubusercontent.com/Fellow3-1/Fellow3-1/output/github-snake.svg
#   https://raw.githubusercontent.com/Fellow3-1/Fellow3-1/output/github-snake-dark.svg

name: Generate GitHub Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *" # daily at midnight (UTC)
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Push snake SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
